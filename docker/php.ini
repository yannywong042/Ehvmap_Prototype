; Upload-limieten voor het inzendformulier.
; De browser comprimeert foto's naar <= 2 MB voordat ze geupload worden, het
; Livewire-uploadendpoint weigert alles boven de 8 MB (config/livewire.php)
; en het inzendformulier alles boven de 4 MB, dus deze waarden geven alleen
; ruime marge. De standaard van php:8.5-apache (2M) weigerde elke
; telefoonfoto stilletjes, waardoor de upload faalde zonder bruikbare
; foutmelding.
upload_max_filesize = 8M
post_max_size = 10M
